[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Omdirigeringar från de gamla Docusaurus-URL:erna ──────────────────
# Netlify kräver att specialtecken i källsökvägar är URL-kodade.

